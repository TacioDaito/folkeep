services:
  keycloak:
    build: ./keycloak
    entrypoint: /bin/bash
    command: /opt/keycloak/init-keycloak.sh
    env_file:
      - ./keycloak/.env
    environment:
      KC_HOSTNAME: "${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}"
      KEYCLOAK_REDIRECT_URIS: "${SCHEME}${EXTERNAL_SPA_SLD}.${TOP_LEVEL_DOMAIN}/api/auth/callback/keycloak"
      KEYCLOAK_WEB_ORIGINS: "${SCHEME}${EXTERNAL_SPA_SLD}.${TOP_LEVEL_DOMAIN}"
    expose:
      - "8080"
    volumes:
      - ./keycloak/data:/opt/keycloak/data
      - ./keycloak/init-keycloak.sh:/opt/keycloak/init-keycloak.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 10
      start_period: 60s
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/localhost/8080; echo -e "GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; cat <&3; exec 3>&-;',
        ]
      timeout: 10s
    networks:
      - app-network

  postgres:
    image: postgres:18.2
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  mongodb:
    image: mongo:8.2
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "./docker-entrypoint.sh"]
    working_dir: /var/www/html
    env_file:
      - ./api/.env
    environment:
      # Override API URLs to point to the correct services within the Docker network by using service names.
      # These names resolve to the respective containers, allowing the API to communicate with PostgreSQL and MongoDB seamlessly.
      DB_HOST: postgres
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      APP_URL: "${SCHEME}${EXTERNAL_API_SLD}.${TOP_LEVEL_DOMAIN}"
      KEYCLOAK_PUBLIC_URL: "${SCHEME}${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}"
      KEYCLOAK_ISSUER: "${SCHEME}${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}/realms/folkeep"
    expose:
      - "8000"
    volumes:
      - ./api:/var/www/html
      - /var/www/html/vendor
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}:host-gateway"

  spa:
    build:
      context: ./spa
      dockerfile: Dockerfile
    env_file:
      - ./spa/.env
    environment:
      NEXTAUTH_URL: "${SCHEME}${EXTERNAL_SPA_SLD}.${TOP_LEVEL_DOMAIN}"
      NEXT_PUBLIC_API_BASE_URL: "${SCHEME}${EXTERNAL_API_SLD}.${TOP_LEVEL_DOMAIN}"
      NEXT_PUBLIC_KEYCLOAK_URL: "${SCHEME}${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}"
    expose:
      - "3000"
    volumes:
      - ./spa:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app-network
    depends_on:
      - api
    extra_hosts:
      - "${EXTERNAL_AUTH_SLD}.${TOP_LEVEL_DOMAIN}:host-gateway"
    command: npm run dev

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      keycloak:
        condition: service_healthy
      spa:
        condition: service_started
      api:
        condition: service_started

  redis:
    image: redis:8.6
    expose:
      - "6379"
    volumes:
      - ./redis/data:/data
    environment:
      - REDIS_ARGS=--requirepass admin --appendonly yes
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres_data:
    driver: local
  mongo_data:
    driver: local
